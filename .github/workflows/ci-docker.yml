name: CI Docker

on:
  push:
    branches: [main]
    paths: &docker-paths
      - "apps/**"
      - "packages/**"
      - "docker/**"
      - "docker-compose*.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".pnpmfile.cjs"
      - "package.json"
      - ".dockerignore"
      - ".github/workflows/ci-docker.yml"
  pull_request:
    paths: *docker-paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_RUNTIME: ghcr.io/${{ github.repository_owner }}/fluch
  IMAGE_MIGRATE: ghcr.io/${{ github.repository_owner }}/fluch-migrate

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & (conditional) push — runtime
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          tags: |
            ${{ env.IMAGE_RUNTIME }}:latest
            ${{ env.IMAGE_RUNTIME }}:sha-${{ github.sha }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      - name: Build & (conditional) push — migrate
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          target: migrate
          tags: |
            ${{ env.IMAGE_MIGRATE }}:latest
            ${{ env.IMAGE_MIGRATE }}:sha-${{ github.sha }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate
