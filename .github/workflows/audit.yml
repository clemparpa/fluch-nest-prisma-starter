name: Audit deps

on:
  # Audit déclenché uniquement sur PR modifiant les deps. Dependabot (S16)
  # couvre la surveillance continue (alerts + security updates en temps réel).
  # Ce job sert de gate de merge : bloque toute PR introduisant une vuln high+.
  pull_request:
    paths:
      - 'package.json'
      - 'apps/**/package.json'
      - 'packages/**/package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
